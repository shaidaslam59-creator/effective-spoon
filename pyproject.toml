[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "omnisphere-360"
version = "0.2.0"
description = "Policy-governed asynchronous multi-agent orchestration platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Unlicense" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "anyio>=4.6,<5",
  "tenacity>=9,<10",
  "cryptography>=43,<47",
  "orjson>=3.10,<4",
  "structlog>=24.4,<26",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "agents", "persistence", "security", "api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
no_implicit_reexport = true

[tool.bandit]
exclude_dirs = ["tests"]
