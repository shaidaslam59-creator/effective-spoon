[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "omnisphere-360"
version = "0.1.0"
description = "Policy-governed asynchronous multi-agent orchestration platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Unlicense" }
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "sqlalchemy[asyncio]>=2.0.32,<3", "aiosqlite>=0.20,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.27,<1", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["core", "agents", "persistence", "security", "api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
