name: Workspace Quality Gates

on:
  push:
    branches:
      - main
      - master
      - "omnisphere-360/**"
  pull_request:
    branches:
      - main
      - master
      - "omnisphere-360/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
      - name: Compile Python sources
        run: python -m compileall -q core agents persistence security api
      - name: Run tests
        run: python -m pytest -q
      - name: Ruff lint
        run: ruff check .
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify distribution archives
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          artifacts = list(dist.iterdir())
          assert artifacts, "No distribution artifacts were produced"
          for artifact in artifacts:
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      bad = archive.testzip()
                      assert bad is None, f"Corrupt wheel member: {bad}"
              elif artifact.name.endswith(".tar.gz"):
                  with tarfile.open(artifact, "r:gz") as archive:
                      assert archive.getmembers(), f"Empty source archive: {artifact}"
          print(f"Verified {len(artifacts)} distribution artifacts")
          PY
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnisphere-360-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
